<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Great+Vibes&family=Montserrat:wght@400;500;600&family=Bodoni+Moda:opsz,wght@6..96,400;6..96,700&family=Cinzel:wght@400;600&family=Prata&family=Italiana&family=Marcellus&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #FDFDFD; }
  a { color: #603090; text-decoration: none; }
  a:hover { color: #D86090; }
</style>
</helmet>
<div style="font-family: Montserrat, Helvetica, sans-serif; color: #0E0E0F; padding: 54px 30px 70px; max-width: 1100px; margin: 0 auto;">
  <p style="margin: 0 0 8px; font-size: 11.5px; letter-spacing: 0.22em; text-transform: uppercase; color: #A84878; font-weight: 600;">Wordmark workshop</p>
  <h1 style="margin: 0 0 6px; font-family: 'Playfair Display', serif; font-weight: 400; font-size: 38px;">The &ldquo;TY&rdquo; serif, six ways</h1>
  <p style="margin: 0 0 44px; font-size: 15.5px; color: #6B6472; max-width: 44em;">Script and heart held constant. Tell me a number and I&rsquo;ll set it site-wide, or switch it yourself in Tweaks on the site file.</p>

  <div style="display: grid; gap: 26px;">
    <sc-for list="{{ options }}" as="o" hint-placeholder-count="6">
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 24px; align-items: center; border-top: 1px solid #EBD8E8; padding-top: 24px;">
        <div>
          <p style="margin: 0 0 4px; font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; font-weight: 600; color: #603090;">{{ o.n }} &nbsp;{{ o.name }}</p>
          <p style="margin: 0; font-size: 14px; line-height: 1.55; color: #6B6472;">{{ o.note }}</p>
        </div>
        <div style="display: flex; align-items: baseline; gap: 9px; justify-content: center;">
          <span style="font-weight: 700; font-size: 58px; letter-spacing: 0.02em; line-height: 1; font-family: {{ o.css }};">TY</span>
          <span style="font-family: 'Great Vibes', cursive; font-size: 50px; color: #603090; line-height: 1;">Designs</span>
          <span style="color: #D86090; font-size: 22px;">&#9825;</span>
        </div>
        <div style="display: flex; align-items: baseline; gap: 6px; justify-content: center; background: #0E0E0F; padding: 16px 18px; border-radius: 3px;">
          <span style="font-weight: 700; font-size: 26px; letter-spacing: 0.02em; line-height: 1; color: #FDFDFD; font-family: {{ o.css }};">TY</span>
          <span style="font-family: 'Great Vibes', cursive; font-size: 23px; color: #D4ADCB; line-height: 1;">Designs</span>
          <span style="color: #D86090; font-size: 12px;">&#9825;</span>
        </div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 1100, &quot;height&quot;: 900}}">
class Component extends DCLogic {
  renderVals() {
    return {
      options: [
        { n: "01", name: "Playfair Display", css: "'Playfair Display', serif", note: "Current. High contrast Didone, warm and familiar." },
        { n: "02", name: "Bodoni Moda", css: "'Bodoni Moda', serif", note: "Sharpest contrast, hairline serifs — closest to the glitter logo's letterforms." },
        { n: "03", name: "Cinzel", css: "'Cinzel', serif", note: "Roman capitals, wide and engraved. Reads like a monogram." },
        { n: "04", name: "Prata", css: "'Prata', serif", note: "Didone with softer weight — elegant without getting thin." },
        { n: "05", name: "Italiana", css: "'Italiana', serif", note: "Very light and fashion-editorial. Boutique, but delicate at small sizes." },
        { n: "06", name: "Marcellus", css: "'Marcellus', serif", note: "Low contrast, calm, classical. Least fussy of the six." }
      ]
    };
  }
}
</script>
</body>
</html>
