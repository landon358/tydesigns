<!doctype html>
<!-- Netlify reads its form definitions from this file. The real form is rendered by
     JavaScript in index.html, which Netlify's deploy-time parser cannot see, so every
     field there has a twin here. Keep the two in step. -->
<html lang="en">
<head><meta charset="utf-8" /><title>TY Designs form definitions</title><meta name="robots" content="noindex" /></head>
<body>
  <form name="order" method="POST" data-netlify="true" enctype="multipart/form-data" hidden>
    <input type="hidden" name="form-name" value="order" />
    <input type="text" name="name" />
    <input type="tel" name="phone" />
    <input type="email" name="email" />
    <input type="text" name="item" />
    <input type="number" name="quantity" />
    <input type="text" name="print_text" />
    <textarea name="idea"></textarea>
    <input type="file" name="photo" />
    <input type="date" name="needed_by" />
    <input type="text" name="delivery" />
  </form>

  <form name="binder" method="POST" data-netlify="true" enctype="multipart/form-data" hidden>
    <input type="hidden" name="form-name" value="binder" />
    <input type="text" name="parent1" />
    <input type="tel" name="phone1" />
    <input type="text" name="parent2" />
    <input type="tel" name="phone2" />
    <input type="email" name="email1" />
    <input type="email" name="email2" />
    <input type="date" name="needed_by" />
    <input type="text" name="child_name" />
    <input type="text" name="child_age" />
    <input type="text" name="child_gender" />
    <input type="text" name="child_birthday" />
    <input type="text" name="favorite_colors" />
    <input type="text" name="photo_provided" />
    <input type="file" name="photo" />
    <input type="text" name="pages" />
    <input type="text" name="page_other" />
    <input type="number" name="extra_pages_qty" />
    <input type="text" name="extra_pages_cost" />
    <input type="text" name="order_total" />
    <input type="text" name="shipping_fee" />
    <input type="text" name="deposit_paid" />
    <input type="text" name="balance_due" />
    <textarea name="instructions"></textarea>
    <input type="text" name="signature" />
    <input type="date" name="signature_date" />
  </form>
</body>
</html>
